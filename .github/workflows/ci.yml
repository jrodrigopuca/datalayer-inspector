name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test:coverage

      - run: pnpm run build

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # On a version tag, package the built extension as a Web Store-ready zip.
  release:
    name: Package release zip
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    # Only this job may write: it creates the GitHub Release for the tag
    # and attaches the Web Store-ready zip to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download extension bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Zip
        run: cd dist && zip -r "../strata-${GITHUB_REF_NAME}.zip" .

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## ["
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version; using a placeholder" >&2
            echo "Release $GITHUB_REF_NAME. See CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" "strata-${GITHUB_REF_NAME}.zip" --clobber

      - name: Upload release zip (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: strata-${{ github.ref_name }}
          path: strata-${{ github.ref_name }}.zip
          retention-days: 90

  # E2E tests need a headed Chromium with the extension loaded. They run on
  # demand until they prove stable in CI; promote to every PR afterwards
  # (see docs/TECH-DEBT.md, item 1).
  e2e:
    name: E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download extension bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - run: pnpm exec playwright install --with-deps chromium

      - run: xvfb-run --auto-servernum pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
